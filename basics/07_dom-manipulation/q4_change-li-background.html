
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML List Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        ul, ol {
            margin: 20px;
            padding-left: 40px;
        }
        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <h2>Unordered List (Bullets)</h2>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
        <li>Mangoes</li>
    </ul>

    <h2>Ordered List (Numbers)</h2>
    <ol>
        <li>Wake up</li>
        <li>Brush teeth</li>
        <li>Have breakfast</li>
        <li>Go to work</li>
    </ol>


    <script>
        let him=document.querySelectorAll("li").forEach(i=>{
            i.style.backgroundColor="cyan"
        });
       
    </script>
</body>
</html>
