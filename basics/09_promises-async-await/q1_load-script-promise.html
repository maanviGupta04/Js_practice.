<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let prom = new Promise((resolve,reject)=>{
            
            const load=(src)=>{
                let file=document.createElement("script")
                file.src=src
                file.onload=()=>resolve("The load was successfull")
                file.onerror=()=>reject("The load was not successfull") 
                document.head.append(file)
            };
            
            load("https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js" )
            
        })
        prom.then((a)=>{
            console.log(a)
        }).catch((err)=>{
            console.log(err)
        })
        </script>
    </body>
</html>
