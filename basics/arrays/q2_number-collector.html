<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numbers=[]

         for (let i = 0; i < 10; i++) {
            let user=Number(prompt("Enter the number"));
            if(user===0){
                break;
            }

            numbers.push(user)
            
         }

         console.log(numbers)

    </script>
</body>
