<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arr = [];
      let user = Number(prompt("Enter the value"));
    
      if(user<0 || isNaN(user)){
        console.log("Invalid Input")
      }

      else if(user===0){
        console.log("Factorial:1")
      }
      
      else{
      for (let i = 1; i <= user; i++) {
        arr.push(i);
      }

      const fact = (a, b) => {
        return a * b;
      };
      console.log("Factorial:",arr.reduce(fact));
      
     }
      
    </script>
  </body>
</html>
